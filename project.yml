name: Blether
options:
  bundleIdPrefix: uk.ohnotnow
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  TranscribeCpp:
    path: Packages/TranscribeCpp
targets:
  Blether:
    type: application
    platform: macOS
    sources:
      - Sources/Blether
      - path: Helpers/kokoro.py
        buildPhase: resources
      - path: Helpers/breeze.py
        buildPhase: resources
      - path: Helpers/pocket.py
        buildPhase: resources
      - path: Helpers/pocket-voices
        type: folder
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: TranscribeCpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.ohnotnow.blether
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/Blether/Blether.entitlements
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Sources/Blether/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: blether
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: "blether listens for your reply after Claude speaks. The microphone opens only while Listen after Claude replies is on."
  BletherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/BletherTests
    dependencies:
      - target: Blether
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.ohnotnow.blether.tests
schemes:
  Blether:
    build:
      targets:
        Blether: all
        BletherTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BletherTests
